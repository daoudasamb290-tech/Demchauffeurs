<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4638" />
      <stop offset="100%" stop-color="#041f18" />
    </linearGradient>
    <linearGradient id="lionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B13C" />
      <stop offset="50%" stop-color="#F3D078" />
      <stop offset="100%" stop-color="#C59620" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D9E75" />
      <stop offset="100%" stop-color="#085041" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- High-end deep dark green round background with border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#1D9E75" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#E2B13C" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Abstract Road Overlay representing VTC -->
  <path d="M 256 120 L 210 380 L 302 380 Z" fill="url(#bgGrad)" opacity="0.4" />
  <path d="M 256 120 L 256 380" stroke="#E2B13C" stroke-width="6" stroke-dasharray="16,12" stroke-linecap="round" opacity="0.8" />

  <!-- Stylized Gaïndé (Lion) Head & Crown Shield -->
  <g filter="url(#glow)">
    <!-- Main Mane Outer Details -->
    <path d="M 256 100 
             C 290 100, 340 120, 360 160 
             C 380 200, 370 240, 380 270 
             C 390 300, 370 330, 350 350 
             C 320 380, 290 390, 256 390 
             C 222 390, 193 380, 162 350 
             C 142 330, 122 300, 132 270 
             C 142 240, 132 200, 152 160 
             C 172 120, 222 100, 256 100 Z" 
          fill="none" stroke="url(#lionGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Lion Eyes and Nose Features - Minimalist Tech Style -->
    <!-- Eyebrows / Forehead -->
    <path d="M 210 210 L 246 225 L 256 240 L 266 225 L 302 210" fill="none" stroke="url(#lionGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Eyes -->
    <polygon points="195,225 225,235 210,245" fill="url(#lionGrad)" />
    <polygon points="317,225 287,235 302,245" fill="url(#lionGrad)" />
    
    <!-- Nose bridge and snout -->
    <path d="M 246 230 L 246 275 L 235 285 L 256 295 L 277 285 L 266 275 L 266 230" fill="none" stroke="url(#lionGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="245,285 267,285 256,295" fill="#1D9E75" />
    
    <!-- Powerful Jaw & Mane Spokes (Wolof/Gaindé Energy lines) -->
    <path d="M 180 260 L 150 280" stroke="url(#lionGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 332 260 L 362 280" stroke="url(#lionGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 190 300 L 165 330" stroke="url(#lionGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 322 300 L 347 330" stroke="url(#lionGrad)" stroke-width="5" stroke-linecap="round" />
    
    <path d="M 220 330 C 235 345, 277 345, 292 330" fill="none" stroke="url(#lionGrad)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Glowing Premium Taxi Crest Overlay at Bottom -->
  <rect x="140" y="385" width="232" height="42" rx="12" fill="url(#accentGrad)" stroke="#E2B13C" stroke-width="4" filter="url(#glow)" />
  
  <text x="256" y="412" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="950" 
        font-size="19" 
        letter-spacing="5" 
        text-anchor="middle">
    CHAUFFEUR
  </text>

  <!-- Dynamic GPS Ring Indicator -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.3" />
</svg>
